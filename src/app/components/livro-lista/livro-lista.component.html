<main class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
    <div>
      <h1 class="page-title mb-1">Catálogo de Livros</h1>
      <p class="text-secondary mb-0">Consulte os livros cadastrados no sistema.</p>
    </div>
    <a class="btn btn-primary mt-2" routerLink="/dados">+ Cadastrar livro</a>
  </div>

  <div class="card">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th>Título</th>
              <th>Resumo</th>
              <th>Editora</th>
              <th>Autores</th>
              <th class="text-center">Ação</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let livro of livros">
              <td class="fw-semibold">
                {{ livro.titulo }}
              </td>
              <td>{{ livro.resumo }}</td>
              <td>{{ obterNome(livro.codEditora) }}</td>
              <td>
                <ul class="mb-0 ps-3">
                  <li *ngFor="let autor of livro.autores">{{ autor }}</li>
                </ul>
              </td>
              <td class="text-center">
                <button class="btn btn-danger btn-sm" type="button" (click)="excluir(livro.codigo)">
                  Excluir
                </button>
              </td>
            </tr>
            <tr *ngIf="livros.length === 0">
              <td colspan="5" class="text-center text-secondary py-4">
                Nenhum livro cadastrado.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>
