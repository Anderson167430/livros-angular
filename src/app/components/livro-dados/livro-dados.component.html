<main class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <h1 class="page-title">Dados do Livro</h1>

      <div class="card">
        <div class="card-body p-4">
          <form (ngSubmit)="incluir()" #livroForm="ngForm" ngNativeValidate>
            <div class="mb-3">
              <label for="titulo" class="form-label">Título</label>
              <input
                id="titulo"
                name="titulo"
                type="text"
                class="form-control"
                [(ngModel)]="livro.titulo"
                required
                maxlength="120"
                placeholder="Digite o título do livro">
            </div>

            <div class="mb-3">
              <label for="resumo" class="form-label">Resumo</label>
              <textarea
                id="resumo"
                name="resumo"
                rows="4"
                class="form-control"
                [(ngModel)]="livro.resumo"
                placeholder="Escreva um resumo do livro"></textarea>
            </div>

            <div class="mb-3">
              <label for="editora" class="form-label">Editora</label>
              <select
                id="editora"
                name="editora"
                class="form-select"
                [(ngModel)]="livro.codEditora"
                required>
                <option [ngValue]="0" disabled>Selecione uma editora</option>
                <option *ngFor="let editora of editoras" [ngValue]="editora.codEditora">
                  {{ editora.nome }}
                </option>
              </select>
            </div>

            <div class="mb-4">
              <label for="autores" class="form-label">Autores (1 por linha)</label>
              <textarea
                id="autores"
                name="autores"
                rows="4"
                class="form-control"
                [(ngModel)]="autoresForm"
                placeholder="Digite um autor por linha"></textarea>
              <div class="form-text">Se houver mais de um autor, digite cada nome em uma linha.</div>
            </div>

            <div class="d-flex gap-2">
              <button class="btn btn-success" type="submit" [disabled]="livroForm.invalid || livro.codEditora === 0">
                Salvar livro
              </button>
              <a class="btn btn-outline-secondary" routerLink="/lista">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
